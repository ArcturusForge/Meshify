# Shared build: CI and Release both call this, so the build steps live in one place.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into packages (no leading v)
        type: string
        default: "0.0.0"
      package:
        description: Produce release archives and upload them as artifacts
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: occt=7.8 qt6-main cmake ninja ccache cxx-compiler libgl-devel libxcb
            prefix_suffix: ""
            cmake_extra: ""
          - os: macos-latest
            packages: occt=7.8 qt6-main cmake ninja ccache cxx-compiler
            prefix_suffix: ""
            cmake_extra: ""
          - os: windows-latest
            packages: occt=7.8 qt6-main cmake ninja ccache
            prefix_suffix: /Library
            cmake_extra: -DCMAKE_CXX_COMPILER=cl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: meshify
          create-args: -c conda-forge ${{ matrix.packages }}
          init-shell: bash
          cache-environment: true

      # Compiler cache: unchanged sources are not recompiled. Saved once per
      # run, restored from the newest earlier run on the same OS.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX${{ matrix.prefix_suffix }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DMESHIFY_VERSION=${{ inputs.version }}
          -DMESHIFY_REQUIRE_QT=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Cache stats
        run: ccache --show-stats

      - name: Package
        if: inputs.package
        run: |
          cd build
          cpack
          ls packages

      # Unpack the archive and run a shipped binary, so a missing bundled
      # library fails here and not on a user's machine.
      - name: Smoke-test package
        if: inputs.package
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          archive=$(ls "$GITHUB_WORKSPACE"/build/packages/Meshify-* | head -1)
          cmake -E tar xf "$archive"
          cd Meshify-*/
          # Empty PATH so Windows cannot pick DLLs up from the conda env.
          env PATH=/nonexistent ./bin/p1_token "$RUNNER_TEMP/smoke/token.stl"
          test -s "$RUNNER_TEMP/smoke/token.stl"

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: meshify-${{ runner.os }}
          path: build/packages/Meshify-*
          if-no-files-found: error
          retention-days: 7
